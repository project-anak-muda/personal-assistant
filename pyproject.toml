[project]
name = "personal-assistant"
version = "1.0.0"
description = "Personal assistant Telegram bot powered by LangChain + LangGraph and Gemini (inference target)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorlog==6.10.1",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "langchain==1.3.1",
    "langgraph==1.2.0",
    "langchain-openai==1.2.2",
    "langchain-google-genai==4.2.2",
    "gspread==6.1.4",
    "google-auth==2.53.0",
    "python-dotenv==1.0.1",
    "tzdata==2025.2",
    "langgraph-checkpoint-postgres==3.1.1",
    "psycopg[binary,pool]==3.3.4",
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
]

# Extras used only by the experimentation surface (main_client.py). FastAPI and
# uvicorn moved to the main dependencies because the deployed webhook image
# (webhook_app.py) needs them. Use: `uv sync --group api`.
[dependency-groups]
api = [
    "requests==2.32.5",
    "python-multipart==0.0.21",
    "pinecone==8.0.0",
]

[tool.uv]
# Application, not a distributable package — install deps only, never the project itself.
package = false
